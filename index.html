<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="A nine-module social media marketing course: theory, practical video labs, assignments, quizzes and a certificate."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Social Media Marketing Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a course app. Emerald "studio" hero, a path of nine modules, and a focused reader for each module (lessons, lab, assignment, quiz). */
:root{
--bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EDE6; --ink:#13201B; --muted:#5A6863; --line:#D7DDD4;
--accent:#0E6B57; --accent-2:#0A5244; --accent-soft:#DCEFE8; --on-accent:#FFFFFF;
--gold:#B9811A; --gold-soft:#F6E9CB; --ok:#1E7A4C; --ok-soft:#DDF1E5; --bad:#B23A2F; --bad-soft:#F8E1DE;
--hero:#0B3A30; --hero-2:#0F4B3E; --hero-ink:#EEF5F1; --hero-muted:#A9C6BB;
--display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
--body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
--mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
--r:14px; --shadow:0 1px 2px rgba(19,32,27,.06), 0 8px 24px rgba(19,32,27,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#0C1210; --surface:#141C19; --surface-2:#1B2521; --ink:#E7EEEA; --muted:#97A59F; --line:#2A3631;
--accent:#3CBF9C; --accent-2:#5AD2B0; --accent-soft:#163A30; --on-accent:#06120E;
--gold:#E8B34C; --gold-soft:#3A2E16; --ok:#4FC98C; --ok-soft:#14321F; --bad:#EA6E62; --bad-soft:#3A1A17;
--hero:#0E2620; --hero-2:#123329; --hero-ink:#EEF5F1; --hero-muted:#93B3A7;
--shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
--bg:#0C1210; --surface:#141C19; --surface-2:#1B2521; --ink:#E7EEEA; --muted:#97A59F; --line:#2A3631;
--accent:#3CBF9C; --accent-2:#5AD2B0; --accent-soft:#163A30; --on-accent:#06120E;
--gold:#E8B34C; --gold-soft:#3A2E16; --ok:#4FC98C; --ok-soft:#14321F; --bad:#EA6E62; --bad-soft:#3A1A17;
--hero:#0E2620; --hero-2:#123329; --hero-ink:#EEF5F1; --hero-muted:#93B3A7;
--shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
/* top bar */
.bar{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:0;text-align:left}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.02rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.74rem}
.bar .spacer{flex:1}
.prog{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.prog .track{width:120px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
@media (max-width:520px){.prog .track{display:none}.brand small{display:none}}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -55% 45%;height:120%;background:radial-gradient(closest-side,var(--hero-2),transparent);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:56px 48px;display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:40px 36px}}
.gift{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(238,245,241,.25);border-radius:99px;padding:6px 12px;color:var(--hero-muted)}
.gift i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:block}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.9rem);font-weight:800;margin:18px 0 14px;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lede{color:var(--hero-muted);font-size:1.08rem;max-width:56ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:700;border:1px solid transparent;text-decoration:none;transition:transform .15s ease,background .2s}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#1B1406}
.btn-ghost{background:transparent;color:var(--hero-ink);border-color:rgba(238,245,241,.3)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2)}
.btn-line{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(238,245,241,.14);border:1px solid rgba(238,245,241,.14);border-radius:18px;overflow:hidden}
.stats div{background:var(--hero);padding:18px 20px}
.stats b{font-family:var(--display);font-size:2rem;font-weight:800;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stats span{color:var(--hero-muted);font-size:.86rem}
/* sections */
.section{padding-block:48px}
.eyebrow{color:var(--accent);font-weight:700}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.sec-head h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
.sec-head p{color:var(--muted);max-width:52ch}
.letter{display:grid;grid-template-columns:auto 1fr;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.letter .av{width:52px;height:52px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.letter p+p{margin-top:10px}
.letter .sig{margin-top:14px;font-family:var(--display);font-weight:700}
.letter .sig small{display:block;font-family:var(--body);font-weight:500;color:var(--muted)}
@media (max-width:560px){.letter{grid-template-columns:1fr}}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:how}
@media (max-width:860px){.how{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.how{grid-template-columns:1fr}}
.how li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;counter-increment:how}
.how li::before{content:counter(how);font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 9px;display:inline-block;margin-bottom:10px}
.how h3{font-size:1.05rem;margin-bottom:4px}
.how p{color:var(--muted);font-size:.92rem}
ol.how{padding:0;margin:0}
/* module path */
.path{display:grid;gap:12px}
.mod{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;text-align:left;color:var(--ink);width:100%;transition:border-color .2s, transform .2s}
.mod:not([disabled]):hover{border-color:var(--accent);transform:translateY(-1px)}
.mod[disabled]{cursor:not-allowed;background:var(--surface-2)}
.mod .num{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem}
.mod.done .num{background:var(--ok);color:var(--on-accent)}
.mod[disabled] .num{background:var(--surface);color:var(--muted)}
.mod h3{font-size:1.18rem;font-weight:700}
.mod p{color:var(--muted);font-size:.92rem;margin-top:2px}
.mod .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.lock{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.open{background:var(--gold-soft);color:var(--gold)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
@media (max-width:620px){.mod{grid-template-columns:48px 1fr;gap:14px}.mod .num{width:48px;height:48px;font-size:1.15rem;border-radius:12px}.mod .st{grid-column:2}}
.cert-teaser{margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:18px;padding:18px 22px}
.cert-teaser h3{font-size:1.1rem}
.cert-teaser p{color:var(--muted);font-size:.92rem}
/* module view */
.mhead{background:var(--hero);color:var(--hero-ink)}
.mhead .wrap{padding-block:30px 0}
.back{background:none;border:0;color:var(--hero-muted);padding:0;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.back:hover{color:var(--hero-ink)}
.mhead h1{font-size:clamp(1.8rem,4.2vw,2.8rem);font-weight:800;margin:14px 0 8px}
.mhead .tag{color:var(--hero-muted);max-width:62ch}
.outcomes{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.outcomes span{border:1px solid rgba(238,245,241,.22);border-radius:99px;padding:5px 12px;font-size:.84rem;color:var(--hero-ink)}
.tabs{display:flex;gap:4px;margin-top:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:var(--hero-muted);padding:12px 16px;border-radius:12px 12px 0 0;font-weight:700;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:.72rem;opacity:.75}
.tab svg{width:14px;height:14px}
.tab .ts{display:none}
.reader{display:grid;grid-template-columns:250px minmax(0,1fr);min-width:0;gap:36px;padding-block:32px 60px}
@media (max-width:900px){.reader{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:20px 48px}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;display:grid;gap:4px}
@media (max-width:900px){.toc{position:static;display:flex;flex-wrap:wrap;gap:8px;min-width:0}.toc button{display:flex;width:auto;padding:8px;border-color:var(--line);background:var(--surface)}.toc button>span:last-child{display:none}.toc button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.toc::before{content:"Lessons";width:100%;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}}
.toc button{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.9rem;line-height:1.35}
.toc button[aria-current="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.toc .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.toc .dot.ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,40px);box-shadow:var(--shadow);min-width:0}
.lesson .kicker{color:var(--accent);font-weight:600}
.lesson h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;margin:8px 0 20px}
.prose{max-width:68ch}
.prose p{margin:0 0 14px}
.prose h3{font-size:1.15rem;font-weight:700;margin:26px 0 10px}
.prose ul,.prose ol{margin:0 0 16px;padding-left:1.2em}
.prose li{margin:4px 0}
.prose strong{font-weight:700}
.callout{border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;padding:14px 18px;margin:18px 0}
.callout b{display:block;font-family:var(--display);margin-bottom:4px}
.example{background:var(--surface-2);border-radius:12px;padding:14px 18px;margin:18px 0;font-size:.95rem}
.example .mono{color:var(--muted);display:block;margin-bottom:6px}
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:700;font-size:.82rem}
.tbl tr:last-child td{border-bottom:0}
.takeaways{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.takeaways h4{font-size:.95rem;margin-bottom:10px}
.takeaways ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.takeaways li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:.95rem}
.takeaways li::before{content:"";width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--accent)}
.lnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:26px}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;background:var(--accent-soft);border-radius:14px;padding:16px;margin:18px 0}
@media (max-width:560px){.calc{grid-template-columns:1fr}}
.calc label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.calc input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.calc output{font-family:var(--display);font-size:1.8rem;font-weight:800;color:var(--accent);line-height:1}
.calc small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
/* lab */
.panel{padding-block:32px 60px}
.intro{color:var(--muted);max-width:62ch;margin-bottom:22px}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media (max-width:400px){.videos{grid-template-columns:1fr}}
.video{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;max-width:100%;background:var(--hero);position:relative;display:grid;place-items:center;color:var(--hero-ink);text-decoration:none;overflow:hidden}
.thumb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px)}
.thumb .play{width:62px;height:62px;border-radius:50%;background:var(--gold);display:grid;place-items:center;position:relative;transition:transform .2s}
.thumb:hover .play{transform:scale(1.08)}
.thumb .play svg{width:22px;height:22px;margin-left:3px}
.thumb .lbl{position:absolute;left:14px;top:12px;color:var(--hero-muted)}
.thumb .yt{position:absolute;right:14px;bottom:12px;color:var(--hero-muted)}
.video .vb{padding:16px 18px;display:grid;gap:8px;flex:1}
.video h4{font-size:1.02rem;font-weight:700;line-height:1.3}
.video p{color:var(--muted);font-size:.9rem}
.video .vf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.vlink{font-weight:700;font-size:.88rem;text-decoration:none}
.assign{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);max-width:820px}
.assign h3{font-size:1.4rem;font-weight:800;margin:6px 0 10px}
.assign ol{padding-left:1.2em;display:grid;gap:8px;margin:16px 0}
.deliver{background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-top:10px}
.deliver b{font-family:var(--display)}
/* quiz */
.quiz{max-width:820px;display:grid;gap:16px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:820px;display:grid;gap:12px;justify-items:start}
.gate h3{font-size:1.3rem}
.gate p{color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.q legend{font-weight:700;font-size:1.02rem;padding:0;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.q legend .mono{color:var(--accent);padding-top:3px}
.q fieldset{border:0;padding:0;margin:0;min-width:0}
.opt{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:12px;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.why b{color:var(--ink)}
.qfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px))}
.qfoot span{color:var(--muted);font-size:.9rem}
.result{border-radius:20px;padding:24px 26px;display:grid;gap:10px;justify-items:start}
.result.pass{background:var(--ok-soft);border:1px solid var(--ok)}
.result.fail{background:var(--bad-soft);border:1px solid var(--bad)}
.result .score{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.result.pass .score{color:var(--ok)}
.result.fail .score{color:var(--bad)}
/* certificate */
.certwrap{padding-block:40px 70px;display:grid;gap:22px;justify-items:center}
.certwrap canvas{width:100%;max-width:960px;height:auto;border-radius:12px;box-shadow:var(--shadow);background:#fff}
.certctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:center}
.certctl label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.certctl input{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:260px;max-width:100%}
.note{color:var(--muted);font-size:.88rem;text-align:center}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:.86rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

title:"Foundations of Social Media Marketing",
tag:"What social media marketing really is, how the major platforms differ, how algorithms decide who sees your posts, and what a social media manager does all week.",

outcomes:["Explain organic, paid and earned media","Pick the right platforms for a business","Understand ranking signals","Describe the SMM role"],
lessons:[
{title:"What social media marketing really is", body:`
<p>Social media marketing (SMM) is the use of social platforms to reach the right people, build trust with them, and move them toward an action that matters to a business: an enquiry, a booking, a purchase, a referral. Posting pictures is the visible part. The real work is deciding <strong>who</strong> you want to reach, <strong>what</strong> you want them to believe, and <strong>what</strong> you want them to do next.</p>
<h3>The three kinds of media</h3>
<div class="tbl"><table><tr><th>Type</th><th>What it is</th><th>Example</th></tr>
<tr><td><strong>Owned</strong></td><td>Channels you control</td><td>Your Instagram page, website, WhatsApp Status, email list</td></tr>
<tr><td><strong>Paid</strong></td><td>Reach you buy</td><td>Instagram and Facebook ads, boosted posts, TikTok ads</td></tr>
<tr><td><strong>Earned</strong></td><td>Attention others give you</td><td>Shares, reviews, reposts, mentions, word of mouth</td></tr></table></div>
<p>Strong brands use all three together: owned content builds trust, paid media speeds up reach, and earned media proves you are worth trusting.</p>
<h3>The customer journey on social</h3>
<p>People rarely buy the first time they see you. They move through stages, and your content should serve each one:</p>
<ol><li><strong>Awareness:</strong> they discover you (Reels, TikToks, shares).</li>
<li><strong>Consideration:</strong> they check you out (your profile, highlights, carousels, reviews).</li>
<li><strong>Conversion:</strong> they act (DM, WhatsApp chat, booking link, purchase).</li>
<li><strong>Loyalty:</strong> they come back and refer others (community, offers, great service).</li></ol>
<div class="callout"><b>Rented land vs owned land</b>Your followers live on a platform you don't own. Accounts get hacked, reach drops, rules change. Always move people from social into something you control, such as a WhatsApp contact list, an email list or a website.</div>`,
takeaways:["SMM is about moving the right people to a valuable action, not just posting.","Combine owned, paid and earned media.","Plan content for every stage: awareness, consideration, conversion, loyalty.","Move followers onto channels you own."]},
{title:"The platform landscape", body:`
<p>Every platform has its own culture, audience and preferred format. A post that wins on LinkedIn can flop on TikTok. Your job is to match the business to the platforms where its customers already spend time.</p>
<div class="tbl"><table><tr><th>Platform</th><th>Best for</th><th>Winning formats</th></tr>
<tr><td>Instagram</td><td>Lifestyle, beauty, health, food, fashion, local services</td><td>Reels, carousels, Stories</td></tr>
<tr><td>TikTok</td><td>Discovery by new people, younger audiences, entertainment-led education</td><td>Short, native-looking video</td></tr>
<tr><td>Facebook</td><td>Older audiences, community groups, Marketplace, the ads engine behind Instagram</td><td>Video, groups, link posts</td></tr>
<tr><td>LinkedIn</td><td>Professionals, B2B, recruitment, thought leadership</td><td>Text posts, document carousels</td></tr>
<tr><td>X (Twitter)</td><td>News, opinion, real-time conversation</td><td>Short posts, threads</td></tr>
<tr><td>YouTube</td><td>Search, long-form education, evergreen content</td><td>Tutorials, Shorts</td></tr>
<tr><td>WhatsApp</td><td>Closing sales, customer service, repeat buyers</td><td>Status, catalog, direct chat</td></tr></table></div>
<h3>How to choose</h3>
<ul><li>Where does the target customer already spend time?</li>
<li>What content can the business realistically produce every week?</li>
<li>Where are competitors getting results, and where are they absent?</li></ul>
<div class="callout"><b>The rule of two</b>Be excellent on two platforms before you are average on six. Most small businesses do well with one discovery platform (Instagram or TikTok) plus one closing channel (WhatsApp).</div>`,
takeaways:["Each platform has its own culture and best formats.","Choose platforms by audience fit and production capacity.","Start with one discovery platform plus one closing channel."]},
{title:"How algorithms decide what people see", body:`
<p>An algorithm is a ranking system. Each platform has far more posts than any person could see, so it predicts which posts each person is most likely to enjoy and shows those first. You can't control the algorithm, but you can give it the signals it rewards.</p>
<h3>The signals that matter most</h3>
<ul><li><strong>Watch time and retention:</strong> do people watch to the end, or rewatch? This is the strongest signal for video.</li>
<li><strong>Shares and sends:</strong> sharing a post to a friend in DMs tells the platform it's valuable.</li>
<li><strong>Saves:</strong> people save content they want to come back to, such as tips, checklists and tutorials.</li>
<li><strong>Comments and replies:</strong> real conversation beats emoji comments.</li>
<li><strong>Relationship:</strong> people who often interact with you see more of you.</li>
<li><strong>Interest match:</strong> the platform learns what topics your content covers and shows it to people interested in those topics.</li></ul>
<h3>Myths to drop</h3>
<ul><li><strong>"Hashtags will make me go viral."</strong> They help with categorising, not reach. Use 3 to 5 relevant ones.</li>
<li><strong>"There is one perfect posting time."</strong> Good content performs at most times. Check your own insights for when your audience is online.</li>
<li><strong>"I've been shadowbanned."</strong> Usually, reach dropped because the content didn't hold attention. Improve the hook first.</li></ul>
<div class="callout"><b>The simple test</b>Before you post, ask: would someone stop scrolling for this, watch to the end, and send it to a friend? If yes, the algorithm will usually agree.</div>`,
takeaways:["Algorithms rank by predicted interest.","Watch time, shares and saves are the most powerful signals.","Consistency and quality beat hacks and hashtags."]},
{title:"The social media manager's role", body:`
<p>A social media manager (SMM) is part strategist, part creator, part customer-service rep and part analyst. Businesses hire one so they can stay visible and win customers without doing it all themselves.</p>
<h3>Core responsibilities</h3>
<ol><li><strong>Strategy:</strong> goals, audience, platforms, content pillars.</li>
<li><strong>Content:</strong> planning, designing, filming, writing captions.</li>
<li><strong>Publishing:</strong> scheduling and posting consistently.</li>
<li><strong>Community:</strong> replying to comments and DMs, and handling complaints.</li>
<li><strong>Advertising:</strong> running and optimising paid campaigns.</li>
<li><strong>Analytics:</strong> tracking results and reporting what's working.</li></ol>
<h3>A typical week</h3>
<div class="tbl"><table><tr><th>Day</th><th>Focus</th></tr>
<tr><td>Monday</td><td>Review last week's numbers, plan this week's posts</td></tr>
<tr><td>Tuesday–Wednesday</td><td>Create: shoot videos, design graphics, write captions</td></tr>
<tr><td>Thursday</td><td>Schedule content, get client approval, check ads</td></tr>
<tr><td>Friday</td><td>Engagement, research trends, send a weekly update</td></tr>
<tr><td>Every day</td><td>15–30 minutes replying to comments and DMs</td></tr></table></div>
<div class="callout"><b>Skills that make you valuable</b>Clear writing, basic design (Canva), phone video editing (CapCut), a feel for trends, people skills, and comfort with numbers. All of these can be learned, and this course covers every one.</div>`,
takeaways:["An SMM covers strategy, content, community, ads and analytics.","A weekly rhythm keeps the work under control.","The core skills can all be learned."]}
],

title:"Strategy, Goals & Audience",
tag:"Turn business goals into social media goals, understand exactly who you're speaking to, audit where you stand, and define a brand voice people recognise.",

outcomes:["Write SMART social goals","Build an audience persona","Run a social audit and competitor analysis","Define brand voice and positioning"],
lessons:[
{title:"From business goals to social goals", body:`
<p>A strategy begins with the business, not the platform. Ask the owner: <em>"In six months, what would make you say social media was worth it?"</em> The answer is usually more enquiries, more bookings, more sales or a stronger reputation. Your social goals must feed that.</p>
<h3>Map business goals to social metrics</h3>
<div class="tbl"><table><tr><th>Business goal</th><th>Social goal</th><th>Metric to track</th></tr>
<tr><td>Be known in our city</td><td>Grow awareness</td><td>Reach, impressions, follower growth</td></tr>
<tr><td>Build trust</td><td>Increase engagement</td><td>Saves, shares, comments, engagement rate</td></tr>
<tr><td>Get more customers</td><td>Generate leads</td><td>DMs, WhatsApp chats, link clicks, form fills</td></tr>
<tr><td>Increase revenue</td><td>Drive sales</td><td>Purchases, bookings, cost per acquisition</td></tr></table></div>
<h3>Make the goal SMART</h3>
<p><strong>S</strong>pecific, <strong>M</strong>easurable, <strong>A</strong>chievable, <strong>R</strong>elevant, <strong>T</strong>ime-bound.</p>
<div class="example"><span class="mono">Weak goal</span>"Grow our Instagram."</div>
<div class="example"><span class="mono">SMART goal</span>"Increase monthly WhatsApp enquiries from Instagram from 20 to 60 by the end of March by posting 4 Reels a week with a clear 'Chat us on WhatsApp' call to action."</div>`,
takeaways:["Start from what the business needs, not what the platform offers.","Every social goal should link to a business outcome.","Write goals in SMART form so you can tell if you hit them."]},
{title:"Knowing your audience", body:`
<p>You can't speak to everyone. The more clearly you picture one ideal customer, the sharper your content becomes. Marketers capture this in an <strong>audience persona</strong>.</p>
<h3>What a persona includes</h3>
<ul><li><strong>Demographics:</strong> age range, location, income level, occupation.</li>
<li><strong>Psychographics:</strong> values, interests, lifestyle, what they aspire to.</li>
<li><strong>Pain points:</strong> what frustrates or worries them.</li>
<li><strong>Objections:</strong> why they hesitate to buy (price, trust, time, fear).</li>
<li><strong>Language:</strong> the exact words they use to describe their problem.</li>
<li><strong>Habits:</strong> which apps they use, and when.</li></ul>
<div class="example"><span class="mono">Sample persona: "Busy Bimpe"</span>32, banker in Lagos, married with one child. Wants to look polished but has little time. Scrolls Instagram on her commute and at night. Worries about overpaying for poor quality. Trusts recommendations from friends and real customer videos. Says "I need something that won't stress me."</div>
<h3>How to research your audience</h3>
<ol><li>Read comments and DMs on your page and on competitors' pages.</li>
<li>Read reviews on Google, Jumia, Instagram and elsewhere.</li>
<li>Ask existing customers why they bought.</li>
<li>Run polls and question boxes in Stories.</li>
<li>Look at your Insights for age, gender, location and active times.</li></ol>`,
takeaways:["Write content for one clear person.","Pain points and objections give you your best content ideas.","Use your customers' own words in your captions."]},
{title:"Social audit & competitor analysis", body:`
<p>Before you plan where to go, you need to know where you are. A <strong>social audit</strong> is a health check of a brand's current accounts. A <strong>competitor analysis</strong> shows what's working in the market and where the gaps are.</p>
<h3>Social audit checklist</h3>
<ul><li>Is the handle consistent across platforms?</li>
<li>Do the profile photo and bio say clearly what the business does, who it's for and how to buy?</li>
<li>Is there a working link or WhatsApp contact?</li>
<li>Are Story Highlights organised (Prices, Reviews, How to order, FAQs)?</li>
<li>How often do they post? When was the last post?</li>
<li>What are the top 5 posts of the last 90 days, and why did they work?</li>
<li>Baseline numbers: followers, average reach, engagement rate, enquiries per month.</li></ul>
<h3>Competitor analysis</h3>
<p>Choose 3 to 5 competitors: some direct (same product, same city) and one aspirational brand you'd like to become. For each, record:</p>
<div class="tbl"><table><tr><th>What to note</th><th>Why</th></tr>
<tr><td>Posting frequency and formats</td><td>Shows the effort level needed to compete</td></tr>
<tr><td>Their best-performing posts</td><td>Proves what the audience responds to</td></tr>
<tr><td>Common complaints in their comments</td><td>Your opportunity to be better</td></tr>
<tr><td>What they are NOT doing</td><td>The gap you can own</td></tr></table></div>
<div class="callout"><b>Finish with a SWOT</b>Strengths, Weaknesses, Opportunities, Threats. One short list each turns your research into decisions.</div>`,
takeaways:["Audit first so you have a baseline to measure growth against.","Study competitors to learn what works and spot gaps.","Turn research into a SWOT with clear actions."]},
{title:"Brand voice & positioning", body:`
<p>People follow brands that feel like someone. <strong>Brand voice</strong> is the personality in your words. <strong>Positioning</strong> is the specific place you want to hold in the customer's mind.</p>
<h3>Define the voice in three words</h3>
<p>Pick three traits, then say what each one means and what it doesn't mean.</p>
<div class="tbl"><table><tr><th>Trait</th><th>We are</th><th>We are not</th></tr>
<tr><td>Warm</td><td>Friendly, caring, we use names</td><td>Overly casual or slangy</td></tr>
<tr><td>Expert</td><td>Clear, accurate, confident</td><td>Full of jargon or arrogant</td></tr>
<tr><td>Encouraging</td><td>Positive, solution-focused</td><td>Pushy or fear-driven</td></tr></table></div>
<h3>Write a positioning statement</h3>
<div class="example"><span class="mono">Formula</span>For <strong>[audience]</strong> who <strong>[need or problem]</strong>, <strong>[brand]</strong> is the <strong>[category]</strong> that <strong>[key benefit]</strong>, unlike <strong>[alternative]</strong>.</div>
<div class="example"><span class="mono">Example</span>For busy professionals in Owerri who want healthy meals without cooking, FreshBox is the meal-prep service that delivers balanced, home-style food to your office by noon, unlike fast food that leaves you tired.</div>
<h3>Visual identity basics</h3>
<ul><li>2 to 3 brand colours, used consistently.</li><li>1 to 2 fonts.</li><li>A consistent photo style (bright and clean, or warm and moody).</li><li>Logo placement rules.</li></ul>`,
takeaways:["Voice is personality in words. Define it with three traits.","A positioning statement keeps every post on-message.","A consistent look makes content instantly recognisable."]}
],

lessons:[
{title:"Instagram for business", body:`
<p>Instagram is often the main shop window for businesses. Each part of the account has a job.</p>
<h3>Profile setup</h3>
<ul><li>Switch to a <strong>Professional account</strong> (Business or Creator) to unlock Insights, contact buttons and ads.</li>
<li><strong>Name field:</strong> include a keyword, e.g. "Ada Bakes | Cakes in Owerri". It's searchable.</li>
<li><strong>Bio formula:</strong> What you do + who it's for + proof + call to action.</li>
<li><strong>Link:</strong> WhatsApp link, booking page or a link-in-bio page.</li>
<li><strong>Highlights:</strong> Prices, Reviews, How to Order, FAQs, Behind the Scenes.</li></ul>
<div class="example"><span class="mono">Bio example</span>Custom cakes for birthdays & weddings in Owerri 🎂<br>500+ happy celebrations<br>Order 5 days ahead · tap below to chat 👇</div>
<h3>Formats and their jobs</h3>
<div class="tbl"><table><tr><th>Format</th><th>Main job</th><th>Tip</th></tr>
<tr><td>Reels</td><td>Reach new people</td><td>Hook in 1–2 seconds; add on-screen text</td></tr>
<tr><td>Carousels</td><td>Teach and earn saves</td><td>Slide 1 is a headline; the last slide is a CTA</td></tr>
<tr><td>Stories</td><td>Build relationships and sell</td><td>Polls, questions, countdowns, behind the scenes</td></tr>
<tr><td>Collab posts</td><td>Borrow another audience</td><td>Co-post with partners or creators</td></tr>
<tr><td>Broadcast channel</td><td>Talk to your biggest fans</td><td>Exclusive updates and early offers</td></tr></table></div>`,
takeaways:["A professional account unlocks insights and tools.","The bio must say what you do, who it's for, proof and the next step.","Reels reach, carousels teach, Stories sell."]},
{title:"TikTok for business", body:`
<p>TikTok's For You page shows content to people who don't follow you yet. That makes it one of the fastest ways for a small business to be discovered, if the content feels native to TikTok.</p>
<h3>What works on TikTok</h3>
<ul><li><strong>Hook in the first 2 seconds:</strong> a bold statement, a question, or a visual surprise.</li>
<li><strong>Native style:</strong> filmed on a phone, natural, talking to camera. Over-produced ads get scrolled past.</li>
<li><strong>Trends with a twist:</strong> use a trending sound or format, but make it about your niche.</li>
<li><strong>Education as entertainment:</strong> "3 mistakes people make when…", "Watch me…", "Day in the life of…".</li>
<li><strong>Replies with video:</strong> answer comments with a new video. Easy content that builds community.</li>
<li><strong>Stitch and Duet:</strong> react to other videos in your niche.</li></ul>
<h3>Posting rhythm</h3>
<p>Consistency matters more than perfection. Many brands start with 3 to 5 short videos a week, study what gets the most watch time, and make more of that.</p>
<div class="callout"><b>Faces build trust</b>Videos with a real person on camera, such as the owner, a staff member or a customer, usually outperform product-only clips.</div>`,
takeaways:["TikTok rewards native, entertaining, phone-shot content.","Win the first two seconds.","Reply to comments with videos to turn questions into content."]},
{title:"Facebook & LinkedIn", body:`
<h3>Facebook</h3>
<p>Facebook still has a large audience, especially among older adults and parents, and it powers the ads for both Facebook and Instagram.</p>
<ul><li><strong>Page:</strong> keep it complete: hours, location, phone, WhatsApp button, reviews.</li>
<li><strong>Groups:</strong> join or create community groups (e.g. city mums' groups, professional groups) and add value before you promote.</li>
<li><strong>Marketplace:</strong> useful for local product sales.</li>
<li><strong>Cross-posting:</strong> share Reels to Facebook as well.</li></ul>
<h3>LinkedIn</h3>
<p>LinkedIn is where professionals, organisations and decision-makers spend time. It suits services, consulting, health professionals, recruitment and B2B.</p>
<ul><li><strong>Personal profiles beat company pages:</strong> people engage with people, so the founder's or expert's profile usually drives the most reach.</li>
<li><strong>Formats:</strong> text posts with a strong first line, document (PDF) carousels, short videos, polls.</li>
<li><strong>Content:</strong> lessons learned, case studies, opinions on industry trends, behind-the-scenes of professional life.</li>
<li><strong>Comment strategy:</strong> thoughtful comments on others' posts build visibility fast.</li></ul>
<div class="example"><span class="mono">LinkedIn opening line</span>"I almost turned down the client that doubled our revenue. Here's what changed my mind:"</div>`,
takeaways:["Facebook remains strong for groups, older audiences and ads.","On LinkedIn, personal expertise beats corporate announcements.","Thoughtful comments are a growth strategy in their own right."]},
{title:"WhatsApp Business & YouTube", body:`
<h3>WhatsApp Business: where sales close</h3>
<p>In many markets, including Nigeria, social media gets attention and WhatsApp closes the sale. Set it up like a professional storefront.</p>
<ul><li><strong>Business profile:</strong> logo, description, address, hours, email, website.</li>
<li><strong>Catalog:</strong> products or services with photos, prices and descriptions customers can browse.</li>
<li><strong>Quick replies:</strong> saved answers for common questions (type "/" to use them).</li>
<li><strong>Greeting and away messages:</strong> instant replies so nobody waits in silence.</li>
<li><strong>Labels:</strong> sort chats into New lead, Paid, Pending delivery, VIP.</li>
<li><strong>Status:</strong> treat it like a second feed. Post offers, testimonials and behind-the-scenes daily.</li>
<li><strong>Click-to-WhatsApp:</strong> link from Instagram, Facebook and ads straight into a chat.</li></ul>
<h3>YouTube: the search engine</h3>
<p>YouTube content keeps getting found for years because people search it. Use it for answers to common questions and tutorials.</p>
<ul><li>Titles that match search terms: "How to…", "Best… for…".</li>
<li>Clear thumbnails: a face, 3–4 words, high contrast.</li>
<li><strong>Shorts</strong> for discovery and long videos for depth and trust.</li></ul>`,
takeaways:["WhatsApp Business is a sales tool: catalog, quick replies, labels, Status.","Link every platform to a WhatsApp chat.","YouTube rewards searchable, evergreen content."]}
],

title:"Content Creation That Converts",
tag:"Plan content pillars, write hooks and captions that stop the scroll, design clean graphics in Canva, and edit short-form video in CapCut.",

lessons:[
{title:"Content pillars & the content mix", body:`
<p><strong>Content pillars</strong> are the 3 to 5 core themes a brand posts about again and again. They end the "what should I post today?" panic and keep the brand focused.</p>
<h3>Example: a skincare clinic</h3>
<div class="tbl"><table><tr><th>Pillar</th><th>Purpose</th><th>Post ideas</th></tr>
<tr><td>Education</td><td>Build authority</td><td>"3 signs your skin barrier is damaged", ingredient explainers</td></tr>
<tr><td>Results</td><td>Prove it works</td><td>Before/after (with consent), testimonials, case stories</td></tr>
<tr><td>Behind the scenes</td><td>Build trust</td><td>Meet the team, a day at the clinic, how equipment is cleaned</td></tr>
<tr><td>Community</td><td>Build connection</td><td>Answering DMs, polls, client shout-outs</td></tr>
<tr><td>Offers</td><td>Drive sales</td><td>Packages, seasonal promos, booking reminders</td></tr></table></div>
<h3>The content mix</h3>
<p>A common rule is <strong>80/20</strong>: about 80% value (educate, entertain, inspire) and about 20% direct promotion. People follow for value and buy because of trust.</p>
<div class="callout"><b>The 4 E's</b>Every post should <strong>E</strong>ducate, <strong>E</strong>ntertain, <strong>E</strong>mpower (inspire) or <strong>E</strong>arn (sell). If a post does none of these, don't post it.</div>`,
takeaways:["Content pillars give you a repeatable plan.","Aim for roughly 80% value and 20% promotion.","Every post should educate, entertain, inspire or sell."]},
{title:"Hooks, captions & copywriting", body:`
<p>The <strong>hook</strong> is the first line or first two seconds. If it fails, nothing else gets seen. Spend as much time on the hook as on the rest of the post.</p>
<h3>Proven hook formulas</h3>
<ul><li><strong>Mistake:</strong> "Stop doing this if you want healthy skin."</li>
<li><strong>Number list:</strong> "5 things I wish I knew before starting my business."</li>
<li><strong>Curiosity:</strong> "Nobody talks about this part of owning a bakery…"</li>
<li><strong>Call-out:</strong> "If you're a nurse thinking about starting a side business, watch this."</li>
<li><strong>Result first:</strong> "How we got 47 bookings from one Reel."</li>
<li><strong>Contrarian:</strong> "Posting every day is ruining your page. Here's why."</li></ul>
<h3>Caption structure</h3>
<ol><li><strong>Hook:</strong> the first line, which shows before "…more".</li>
<li><strong>Value:</strong> the tip, story or explanation. Use short lines and white space.</li>
<li><strong>CTA:</strong> one clear next step: "Save this", "Send to a friend who needs it", "Tap the link to book", "DM us 'PRICE'".</li></ol>
<h3>Copywriting frameworks</h3>
<div class="tbl"><table><tr><th>Framework</th><th>Steps</th></tr>
<tr><td>PAS</td><td>Problem → Agitate (why it hurts) → Solution</td></tr>
<tr><td>AIDA</td><td>Attention → Interest → Desire → Action</td></tr>
<tr><td>Before–After–Bridge</td><td>Life before → life after → how you get there</td></tr></table></div>
<p>Use 3 to 5 relevant hashtags, write alt text for accessibility, and read every caption aloud before posting.</p>`,
takeaways:["The hook decides whether anything else gets seen.","Captions follow Hook → Value → CTA.","Use one clear CTA per post."]},
{title:"Designing graphics with Canva", body:`
<p>You don't need to be a graphic designer to create professional content. Canva gives you templates, brand kits and resizing, and good design follows a few simple rules.</p>
<h3>Design principles</h3>
<ul><li><strong>Hierarchy:</strong> one big headline, smaller supporting text. The eye should know where to look first.</li>
<li><strong>Contrast:</strong> dark text on light backgrounds or the reverse. Never yellow on white.</li>
<li><strong>One idea per slide:</strong> carousels work when each slide makes one point.</li>
<li><strong>White space:</strong> empty space makes content feel premium.</li>
<li><strong>Consistency:</strong> same fonts, colours and layout style every time.</li></ul>
<h3>Sizes to remember</h3>
<div class="tbl"><table><tr><th>Use</th><th>Size (pixels)</th></tr>
<tr><td>Instagram/Facebook feed (portrait, recommended)</td><td>1080 × 1350</td></tr>
<tr><td>Square post</td><td>1080 × 1080</td></tr>
<tr><td>Stories, Reels, TikTok</td><td>1080 × 1920</td></tr>
<tr><td>YouTube thumbnail</td><td>1280 × 720</td></tr></table></div>
<div class="callout"><b>Set up a Brand Kit</b>In Canva, save the brand's logo, colours and fonts once. Every design then stays on-brand in one click.</div>`,
takeaways:["Hierarchy, contrast and white space make designs look professional.","Use 1080×1350 for feed posts and 1080×1920 for vertical video.","A Canva Brand Kit keeps everything consistent."]},
{title:"Short-form video with CapCut", body:`
<p>Short-form video (Reels, TikTok, Shorts) is currently the strongest way to reach new people. A phone, natural light and CapCut are enough to make good videos.</p>
<h3>The structure of a winning short video</h3>
<ol><li><strong>Hook (0–3 sec):</strong> say or show the most interesting thing first.</li>
<li><strong>Value (3–25 sec):</strong> deliver the tip, story or demonstration fast.</li>
<li><strong>Payoff:</strong> the result, the reveal, the answer.</li>
<li><strong>CTA:</strong> follow, save, comment or DM.</li></ol>
<h3>Filming tips</h3>
<ul><li>Face a window for soft, flattering light.</li>
<li>Clean the lens. Film vertical, at eye level, with the phone propped steady.</li>
<li>Sound matters more than picture: use a cheap lapel mic or film in a quiet room.</li>
<li>Batch-film several videos in one session and change your top between them.</li></ul>
<h3>Editing in CapCut</h3>
<ul><li>Cut pauses and "umms". Keep the pace moving, roughly a cut every 2–3 seconds.</li>
<li>Add <strong>auto-captions</strong>, because many people watch with sound off.</li>
<li>Add on-screen text for the hook.</li>
<li>Keep background music low under speech.</li>
<li>Export in 1080p at 30fps.</li></ul>`,
takeaways:["Hook → Value → Payoff → CTA.","Good light and clear sound beat expensive cameras.","Always add captions, since many people watch muted."]}
],

title:"Planning, Scheduling & Workflow",
tag:"Build a content calendar, batch and repurpose content, schedule with the right tools, and use AI wisely so you deliver every week without burning out.",

outcomes:["Create a monthly content calendar","Batch and repurpose content","Schedule with Meta Business Suite","Use AI responsibly"],
lessons:[
{title:"The content calendar", body:`
<p>A <strong>content calendar</strong> is the plan of what goes out, where and when. It turns strategy into action and ends last-minute scrambling.</p>
<h3>What to include for each post</h3>
<ul><li>Date and time</li><li>Platform(s)</li><li>Content pillar</li><li>Format (Reel, carousel, Story, static)</li><li>Hook and caption</li><li>Visual or file link</li><li>CTA</li><li>Status: Idea → Drafted → Approved → Scheduled → Posted</li></ul>
<h3>Plan around key dates</h3>
<p>Mark the moments your audience cares about: Valentine's Day, Mother's Day, Easter, Eid, Independence Day (1 October in Nigeria), back-to-school, Black Friday, Christmas and New Year, plus industry days relevant to your niche (e.g. World Health Day for health brands).</p>
<div class="example"><span class="mono">A simple weekly rhythm (4 posts)</span>Mon: Education carousel · Wed: Reel (tip or trend) · Fri: Results or testimonial · Sat: Offer or behind the scenes. Stories every day.</div>
<p>Google Sheets, Notion, Trello or Canva's Content Planner all work. The best tool is the one you'll actually keep updated.</p>`,
takeaways:["A calendar turns strategy into weekly action.","Track each post's status from idea to posted.","Plan campaigns around dates your audience cares about."]},
{title:"Batching & repurposing", body:`
<p><strong>Batching</strong> means doing similar tasks together: write all captions in one sitting, film all videos in one session. Switching between tasks wastes time and energy.</p>
<h3>A batching week</h3>
<div class="tbl"><table><tr><th>Block</th><th>Task</th></tr>
<tr><td>Block 1 (2 hrs)</td><td>Plan next 2–4 weeks of ideas and hooks</td></tr>
<tr><td>Block 2 (3 hrs)</td><td>Film all videos and take all photos</td></tr>
<tr><td>Block 3 (3 hrs)</td><td>Edit videos and design graphics</td></tr>
<tr><td>Block 4 (1 hr)</td><td>Write captions and schedule everything</td></tr></table></div>
<h3>Repurposing: one idea, many posts</h3>
<p>One strong piece of content can become many:</p>
<ol><li>A 60-second Reel on "5 tips for…"</li><li>→ a 6-slide carousel with the same tips</li><li>→ 5 separate Stories, one tip each, with polls</li><li>→ a LinkedIn text post sharing the lesson</li><li>→ a WhatsApp Status series</li><li>→ a YouTube Short</li><li>→ a quote graphic of the strongest line</li></ol>
<div class="callout"><b>Recycle your winners</b>Your audience doesn't see everything you post. Re-share your best content every 2–3 months with a fresh hook or cover.</div>`,
takeaways:["Batch similar tasks to save hours each week.","Turn one idea into 5–10 pieces of content.","Repost your best performers with fresh hooks."]},
{title:"Scheduling tools", body:`
<p>Scheduling means preparing posts in advance and letting a tool publish them at set times. It protects consistency when life gets busy.</p>
<div class="tbl"><table><tr><th>Tool</th><th>Good for</th><th>Cost</th></tr>
<tr><td>Meta Business Suite</td><td>Facebook + Instagram posts, Reels, Stories; inbox; insights</td><td>Free</td></tr>
<tr><td>Canva Content Planner</td><td>Design and schedule from the same place</td><td>Canva Pro</td></tr>
<tr><td>Buffer</td><td>Simple multi-platform scheduling</td><td>Free plan + paid</td></tr>
<tr><td>Metricool</td><td>Scheduling plus strong analytics and competitor tracking</td><td>Free plan + paid</td></tr>
<tr><td>Later</td><td>Visual Instagram planning</td><td>Paid plans</td></tr>
<tr><td>TikTok (desktop)</td><td>Native TikTok scheduling</td><td>Free</td></tr></table></div>
<p>Tool plans and prices change often, so check each tool's site before you commit.</p>
<h3>Client approval workflow</h3>
<ol><li>Share a weekly or monthly content preview (calendar or doc).</li>
<li>Set a deadline for feedback, e.g. "Approve by Thursday 5pm."</li>
<li>Limit revision rounds in your agreement (e.g. 2 rounds).</li>
<li>Schedule only approved content.</li></ol>
<div class="callout"><b>Scheduling isn't the whole job</b>Schedule the posts, but show up live for comments and DMs, especially in the first hour after posting.</div>`,
takeaways:["Meta Business Suite is free and covers Facebook and Instagram.","Use an approval workflow with clear deadlines.","Engage live even when posts are scheduled."]},
{title:"Working smarter with AI", body:`
<p>AI assistants (such as Claude or ChatGPT) can speed up a social media manager's work a lot, as long as you remain the editor.</p>
<h3>Great uses</h3>
<ul><li>Brainstorming 30 post ideas for a content pillar.</li>
<li>Writing 10 hook variations to choose from.</li>
<li>Drafting a caption you then rewrite in the brand voice.</li>
<li>Repurposing a long video transcript into a carousel outline.</li>
<li>Summarising competitor research or customer reviews.</li>
<li>Drafting polite replies to tricky comments.</li></ul>
<h3>Rules for responsible use</h3>
<ul><li><strong>Edit everything:</strong> AI text can sound generic. Add real stories, local references and the brand's personality.</li>
<li><strong>Fact-check:</strong> especially health, legal, financial and statistics claims.</li>
<li><strong>Protect privacy:</strong> never paste customers' personal data or confidential client information.</li>
<li><strong>Be honest:</strong> don't create fake reviews, fake testimonials or misleading images.</li></ul>
<div class="example"><span class="mono">Prompt template</span>"You are a social media strategist. My business is [what you sell] for [audience] in [city]. My brand voice is [3 traits]. Give me 10 Reel ideas for the content pillar [pillar], each with a 1-line hook and a CTA."</div>`,
takeaways:["Use AI for ideas and first drafts. You are the editor.","Always fact-check and protect private data.","Never use AI to fake reviews or results."]}
],

title:"Community, Engagement & Influencers",
tag:"Turn followers into a loyal community: manage comments and DMs, handle complaints with grace, use social proof, and partner with creators.",
hours:"3 hrs",
outcomes:["Run daily community management","Handle complaints and crises","Collect and use social proof","Plan an influencer partnership"],
lessons:[
{title:"Community management", body:`
<p>Followers watch. A community talks back. <strong>Community management</strong> is the daily work of responding, starting conversations and making people feel seen. It builds trust, and the algorithm rewards it too.</p>
<h3>Daily habits</h3>
<ul><li><strong>Reply fast:</strong> aim to answer comments and DMs within a few hours during business hours.</li>
<li><strong>Reply with questions:</strong> "Thank you! Which colour would you pick?" keeps the conversation going.</li>
<li><strong>Use names:</strong> personal replies feel human.</li>
<li><strong>Engage outward:</strong> spend 15 minutes commenting meaningfully on customers', partners' and niche accounts' posts.</li>
<li><strong>Treat DMs as your sales pipeline:</strong> every "How much?" is a potential customer, not an annoyance.</li></ul>
<h3>Saved replies for DMs</h3>
<div class="example"><span class="mono">Price enquiry</span>"Hi [Name]! Thank you for reaching out 😊 Our [service] starts from ₦[price], and it includes [benefits]. Would you like me to check available dates for you this week?"</div>
<div class="callout"><b>Never answer "Check DM" with nothing else</b>When someone asks the price publicly, reply publicly ("Sent you the details, Ada! 💛") and then send the details in the DM. Others are watching how you treat customers.</div>`,
takeaways:["Community is built by responding consistently and personally.","DMs are your sales pipeline.","Public replies show everyone how you treat customers."]},
{title:"Handling complaints & crises", body:`
<p>Every business gets negative comments. How you respond matters more than the complaint itself. A well-handled complaint can create a loyal customer.</p>
<h3>The 4-step response</h3>
<ol><li><strong>Acknowledge:</strong> "Thank you for letting us know, Chidi."</li>
<li><strong>Apologise sincerely:</strong> "We're sorry your order arrived late. That's not the experience we want for you."</li>
<li><strong>Act:</strong> "We're looking into it right now."</li>
<li><strong>Move it to private:</strong> "Please check your DM so we can sort this out quickly."</li></ol>
<h3>Do and don't</h3>
<div class="tbl"><table><tr><th>Do</th><th>Don't</th></tr>
<tr><td>Respond calmly and quickly</td><td>Argue or get defensive in public</td></tr>
<tr><td>Follow up after it's solved</td><td>Delete genuine complaints</td></tr>
<tr><td>Hide or report spam, scams and abuse</td><td>Ignore it and hope it disappears</td></tr>
<tr><td>Escalate serious issues to the owner</td><td>Make promises you can't keep</td></tr></table></div>
<h3>Prepare a crisis plan</h3>
<p>Decide in advance: who must approve responses, how fast you'll respond, when to pause scheduled posts (always during a serious crisis), and a holding statement you can adapt. Also watch for fake accounts copying the brand to scam customers. Report them and warn followers.</p>`,
takeaways:["Acknowledge, apologise, act, move it private.","Never argue publicly or delete genuine complaints.","Have a crisis plan before you need one."]},
{title:"User-generated content & social proof", body:`
<p><strong>Social proof</strong> means people trust what others like them say more than what a brand says about itself. <strong>User-generated content (UGC)</strong> is content made by customers: photos, videos, reviews and mentions.</p>
<h3>Types of social proof</h3>
<ul><li>Screenshot testimonials from WhatsApp and DMs (hide personal details).</li>
<li>Video testimonials: even 15 seconds on a phone is powerful.</li>
<li>Customer photos and tagged Stories, reposted.</li>
<li>Reviews on Google and Facebook.</li>
<li>Numbers: "500+ happy clients", "Rated 4.9 by 200 customers".</li>
<li>Recognisable partners and media mentions.</li></ul>
<h3>How to get more UGC</h3>
<ol><li>Ask at the moment of delight: right after delivery or a great result.</li>
<li>Make it easy: send a direct review link or a 3-question template.</li>
<li>Create a branded hashtag or photo spot.</li>
<li>Reward it: feature customers, run monthly giveaways for tagged posts.</li></ol>
<div class="callout"><b>Ethics and consent</b>Always ask permission before reposting someone's content, credit them, and never fake testimonials. For health, beauty and medical brands, get clear written consent for before-and-after images and protect patient privacy.</div>`,
takeaways:["People trust customers more than brands.","Ask for testimonials at the moment of delight.","Always get permission, especially for before-and-after images."]},
{title:"Influencer & creator partnerships", body:`
<p>Influencer marketing means partnering with creators whose audience trusts them. For small businesses, the best results often come from <strong>nano</strong> and <strong>micro</strong> creators, not celebrities.</p>
<div class="tbl"><table><tr><th>Tier</th><th>Followers</th><th>Strength</th></tr>
<tr><td>Nano</td><td>1k–10k</td><td>Very high trust, affordable, local</td></tr>
<tr><td>Micro</td><td>10k–100k</td><td>Strong niche authority, good engagement</td></tr>
<tr><td>Macro</td><td>100k–1M</td><td>Large reach, higher cost</td></tr>
<tr><td>Mega</td><td>1M+</td><td>Mass awareness, expensive, lower trust per follower</td></tr></table></div>
<h3>How to vet a creator</h3>
<ul><li>Does their audience match your customer (location, age, interests)?</li>
<li>Is engagement real? Look for genuine comments, not just emojis and "nice pic".</li>
<li>Check for fake-follower signs: sudden jumps in followers, low views compared with follower count.</li>
<li>Does their content style and values fit your brand?</li>
<li>Ask for their recent results or insights screenshots.</li></ul>
<h3>Make the partnership work</h3>
<ol><li><strong>Brief:</strong> goal, key message, must-include points, do's and don'ts, deadline.</li>
<li><strong>Agreement:</strong> deliverables (e.g. 1 Reel + 3 Stories), dates, payment, usage rights.</li>
<li><strong>Creative freedom:</strong> let them speak in their own voice. It's why their audience trusts them.</li>
<li><strong>Disclosure:</strong> paid posts should be labelled (#ad or the platform's paid partnership tag).</li>
<li><strong>Track:</strong> use a unique discount code or link to measure sales.</li></ol>`,
takeaways:["Nano and micro creators often deliver the best return for small brands.","Vet audience fit and real engagement, not follower count.","Use a clear brief, an agreement, disclosure and tracking."]}
],

title:"Paid Social Advertising",
tag:"Know when to pay, how Meta Ads Manager is structured, how to target the right people, set budgets, test creatives and read ad results.",
hours:"4.5 hrs",
outcomes:["Choose the right campaign objective","Structure campaigns, ad sets and ads","Build core, custom and lookalike audiences","Test, budget and read ad metrics"],
lessons:[
{title:"When to pay & how ads work", body:`
<p>Organic content builds trust over time. Paid ads buy speed and precision: you choose exactly who sees your message and when. The best results come when you put money behind content that is already proven organically.</p>
<h3>Boost button vs Ads Manager</h3>
<div class="tbl"><table><tr><th></th><th>Boost post</th><th>Ads Manager</th></tr>
<tr><td>Ease</td><td>Very easy, a few taps</td><td>More steps, more control</td></tr>
<tr><td>Objectives</td><td>Limited</td><td>Full range (awareness, traffic, leads, sales…)</td></tr>
<tr><td>Targeting & testing</td><td>Basic</td><td>Advanced audiences, placements, A/B testing</td></tr>
<tr><td>Best for</td><td>Quick visibility on a strong post</td><td>Campaigns with real business goals</td></tr></table></div>
<h3>How the ad auction works</h3>
<p>Every time someone opens the app, advertisers compete for that ad space. The winner isn't only the highest bidder. Platforms also weigh <strong>ad quality</strong> and <strong>estimated action rate</strong> (how likely the person is to respond). Better creative can mean cheaper results.</p>
<div class="callout"><b>Before you spend</b>Make sure the destination is ready: an optimised profile, a working WhatsApp number with quick replies, or a landing page that loads fast on mobile. Ads can't fix a weak offer or a broken follow-up.</div>`,
takeaways:["Ads buy speed and precision. Put money behind proven content.","Ads Manager gives far more control than the Boost button.","Good creative lowers costs in the ad auction."]},
{title:"Meta Ads Manager structure", body:`
<p>Meta (Facebook and Instagram) ads are organised in three levels. Understanding this structure is the foundation of running ads well.</p>
<div class="tbl"><table><tr><th>Level</th><th>What you set</th></tr>
<tr><td><strong>1. Campaign</strong></td><td>The <strong>objective</strong>: what you want people to do</td></tr>
<tr><td><strong>2. Ad set</strong></td><td><strong>Audience</strong>, <strong>budget</strong>, <strong>schedule</strong>, <strong>placements</strong>, conversion location (website, WhatsApp, Messenger, Instagram DM)</td></tr>
<tr><td><strong>3. Ad</strong></td><td>The <strong>creative</strong> (image or video), primary text, headline, CTA button</td></tr></table></div>
<h3>Campaign objectives</h3>
<ul><li><strong>Awareness:</strong> show your ad to as many relevant people as possible.</li>
<li><strong>Traffic:</strong> send people to a website, WhatsApp or profile.</li>
<li><strong>Engagement:</strong> get messages, video views or post engagement.</li>
<li><strong>Leads:</strong> collect contact details through forms, calls or chats.</li>
<li><strong>App promotion:</strong> get app installs.</li>
<li><strong>Sales:</strong> drive purchases on a website or catalog.</li></ul>
<div class="example"><span class="mono">Example</span>A salon wants bookings via WhatsApp → Objective: <strong>Engagement</strong> (messages) or <strong>Leads</strong> → Conversion location: WhatsApp → Audience: women 22–45 within 10 km → Creative: a 15-second Reel of a transformation with "Chat us to book".</div>`,
takeaways:["Campaign = objective, Ad set = audience + budget, Ad = creative.","Choose the objective that matches the action you want.","Click-to-WhatsApp ads suit businesses that close sales in chat."]},
{title:"Targeting & audiences", body:`
<p>Targeting decides who sees your ads. Meta offers three main audience types.</p>
<h3>1. Core audiences</h3>
<p>Built from location, age, gender, language, interests and behaviours. Example: "Women 25–45 in Owerri and Port Harcourt interested in skincare."</p>
<h3>2. Custom audiences (warm audiences)</h3>
<p>People who already know you:</p>
<ul><li>Instagram or Facebook engagers (last 30–365 days)</li><li>Video viewers (e.g. watched 50%+)</li><li>Website visitors (requires the Meta Pixel)</li><li>Customer lists (phone numbers or emails, uploaded securely and with consent)</li></ul>
<h3>3. Lookalike audiences</h3>
<p>Meta finds new people who resemble your best customers or engagers. Great for scaling once you have a good source audience.</p>
<h3>Broad targeting and Advantage+</h3>
<p>Meta's AI targeting has become strong. With good creative, broad audiences (only location and age set) often perform as well as or better than narrow interest stacks. Your creative does the targeting by attracting the right people.</p>
<div class="callout"><b>Retarget warm audiences</b>People who watched your videos or messaged you before are far more likely to buy. Always run a small retargeting ad set alongside your cold audience campaigns.</div>`,
takeaways:["Core = demographics and interests, Custom = people who know you, Lookalike = people like your best customers.","Strong creative lets broad targeting work.","Retargeting warm audiences is usually your cheapest win."]},
{title:"Budgets, testing & metrics", body:`
<h3>Budgeting</h3>
<ul><li>Start small with a test budget you can afford to lose while you learn.</li>
<li>Give each test a few days (often 3–7) before judging. The system needs time and data.</li>
<li>Scale winners gradually (e.g. increase the budget by 20–30% every few days) instead of doubling overnight.</li></ul>
<h3>Testing (A/B testing)</h3>
<p>Change <strong>one variable</strong> at a time so you know what caused the difference: hook, creative, headline, audience or offer. Creative is usually the biggest lever, so test 3–5 different videos or images.</p>
<h3>Key ad metrics</h3>
<div class="tbl"><table><tr><th>Metric</th><th>Meaning</th></tr>
<tr><td>CPM</td><td>Cost per 1,000 impressions</td></tr>
<tr><td>CTR</td><td>Click-through rate: % of people who clicked</td></tr>
<tr><td>CPC</td><td>Cost per click</td></tr>
<tr><td>CPL / CPA</td><td>Cost per lead / cost per acquisition (sale)</td></tr>
<tr><td>ROAS</td><td>Return on ad spend: revenue ÷ ad spend</td></tr>
<tr><td>Frequency</td><td>Average times each person saw the ad (very high = ad fatigue)</td></tr></table></div>
<div class="example"><span class="mono">ROAS example</span>You spend ₦50,000 on ads and they generate ₦200,000 in sales. ROAS = 200,000 ÷ 50,000 = <strong>4</strong> (₦4 back for every ₦1 spent).</div>
<h3>Tracking and policies</h3>
<p>Install the <strong>Meta Pixel</strong> (and the Conversions API where possible) on your website to track actions and build audiences. Follow ad policies: health, finance and before-and-after claims are restricted, so read Meta's advertising standards before running ads in sensitive categories.</p>`,
takeaways:["Test small, give tests time, scale gradually.","Change one variable at a time. Creative is the biggest lever.","Know CPM, CTR, CPC, CPA, ROAS and frequency."]}
],

title:"Analytics & Reporting",
tag:"Measure what matters, read native insights, run tests and present results so clients and bosses see the value of your work.",
hours:"3 hrs",
outcomes:["Calculate engagement rate","Separate vanity metrics from value metrics","Read Instagram and TikTok insights","Build a monthly report"],
lessons:[
{title:"Metrics that matter", body:`
<p>Analytics tell you what's working so you can do more of it. The trick is knowing which numbers matter for your goal.</p>
<div class="tbl"><table><tr><th>Metric</th><th>What it tells you</th></tr>
<tr><td>Reach</td><td>How many unique people saw your content</td></tr>
<tr><td>Impressions / views</td><td>Total times content was displayed (one person can count many times)</td></tr>
<tr><td>Engagement rate</td><td>How much people interact relative to reach</td></tr>
<tr><td>Saves & shares</td><td>How valuable people find the content</td></tr>
<tr><td>Watch time & retention</td><td>Whether videos hold attention</td></tr>
<tr><td>Profile visits & link clicks</td><td>Interest in learning more or buying</td></tr>
<tr><td>Follower growth rate</td><td>How fast the audience is growing</td></tr>
<tr><td>Conversions</td><td>Enquiries, bookings, sales: the business result</td></tr></table></div>
<h3>Engagement rate</h3>
<div class="example"><span class="mono">Formula</span>Engagement rate (by reach) = (likes + comments + shares + saves) ÷ reach × 100</div>
<div class="calc" id="erCalc">
<label for="erEng">Total engagements<input id="erEng" type="number" min="0" value="180" inputmode="numeric"></label>
<label for="erReach">Reach<input id="erReach" type="number" min="1" value="4000" inputmode="numeric"></label>
<div><output id="erOut" for="erEng erReach">4.5%</output><small id="erNote">Try your own numbers</small></div>
</div>
<p>There's no universal "good" number. Rates vary by platform, niche and account size. Compare against your own past performance and against close competitors.</p>
<div class="callout"><b>Vanity vs value</b>Likes and follower counts feel good but don't pay bills. Prioritise metrics that connect to the goal: saves, shares, DMs, clicks, bookings, sales.</div>`,
takeaways:["Reach is people; impressions are views.","Engagement rate = engagements ÷ reach × 100.","Value metrics beat vanity metrics."]},
{title:"Reading native insights", body:`
<p>Every platform has free built-in analytics. Check them weekly and do a deeper review monthly.</p>
<h3>Instagram Insights (Professional account)</h3>
<ul><li><strong>Overview:</strong> accounts reached, accounts engaged, follower changes.</li>
<li><strong>Content:</strong> sort posts and Reels by reach, saves, shares or watch time to find your winners.</li>
<li><strong>Audience:</strong> top cities, age ranges, gender and the most active times.</li>
<li><strong>Reels:</strong> average watch time and skip rate show whether your hook works.</li></ul>
<h3>Meta Business Suite</h3>
<p>Combines Facebook and Instagram results, shows trends over time and lets you export data.</p>
<h3>TikTok Analytics</h3>
<ul><li>Video views, average watch time and the % who watched the full video.</li>
<li><strong>Traffic source:</strong> For You vs Following vs search tells you how you're being discovered.</li>
<li>Follower activity: when your audience is online.</li></ul>
<div class="callout"><b>Look for patterns, not single posts</b>One viral post can be luck. Look across 10–20 posts: which pillar, format, hook style and length consistently does best?</div>`,
takeaways:["Check insights weekly, review deeply monthly.","Sort content by saves, shares and watch time to find winners.","Look for patterns across many posts."]},
{title:"Testing & optimisation", body:`
<p>Great social media managers treat content as a series of experiments. Each week you learn a little more about what your audience wants.</p>
<h3>The optimisation loop</h3>
<ol><li><strong>Measure:</strong> collect the numbers.</li>
<li><strong>Analyse:</strong> what performed above or below average, and why?</li>
<li><strong>Hypothesise:</strong> "Reels with a question hook will get more watch time."</li>
<li><strong>Test:</strong> post 3–4 pieces that test the idea.</li>
<li><strong>Decide:</strong> do more of what wins, drop what doesn't.</li></ol>
<h3>What to test</h3>
<ul><li>Hook styles (question vs bold statement vs result-first)</li>
<li>Formats (Reel vs carousel vs static)</li>
<li>Video length (10 sec vs 30 sec vs 60 sec)</li>
<li>Topics within each pillar</li>
<li>CTAs ("Save this" vs "DM us" vs "Comment PRICE")</li>
<li>Posting days and times</li></ul>
<div class="callout"><b>Give it time</b>Social media growth compounds. Judge a strategy over about 90 days of consistent effort, not after one week.</div>`,
takeaways:["Measure → analyse → hypothesise → test → decide.","Test one idea across several posts.","Judge a strategy over months, not days."]},
{title:"Reporting to clients & bosses", body:`
<p>A good report proves your value and keeps clients paying. A bad report is a screenshot of follower numbers. Clients want to know: <strong>is this working, and what's next?</strong></p>
<h3>A one-page monthly report structure</h3>
<ol><li><strong>Summary:</strong> 3 sentences on the month's results in plain language.</li>
<li><strong>Goal tracker:</strong> KPI vs target (e.g. enquiries: 48 of 60 target).</li>
<li><strong>Key numbers:</strong> reach, engagement rate, follower growth, link clicks, enquiries, with change vs last month.</li>
<li><strong>Top 3 posts:</strong> with a note on why they worked.</li>
<li><strong>What didn't work:</strong> and what you learned.</li>
<li><strong>Ads summary</strong> (if running): spend, results, cost per result, ROAS.</li>
<li><strong>Next month's plan:</strong> 3 specific actions.</li></ol>
<div class="example"><span class="mono">Summary example</span>"October was our strongest month yet. Reach grew 38% thanks to the new 'myth-busting' Reels, and WhatsApp enquiries rose from 31 to 48. In November we'll make more myth-busting videos and launch a small retargeting ad for people who watched them."</div>
<p>Use simple charts, highlight changes with arrows or colour, and avoid jargon. Send it on the same day every month.</p>`,
takeaways:["Reports answer: is it working, and what's next?","Compare KPIs against goals and last month.","Always end with a clear plan."]}
],

{
title:"Building Your Social Media Career",
tag:"Package your skills into services, price with confidence, find and win clients, and run professional, long-term client relationships. Includes the capstone project.",
hours:"4 hrs",
outcomes:["Design service packages","Price your work","Find and pitch clients","Onboard and retain clients professionally"],
lessons:[
{title:"Your offer & services", body:`
<p>Whether you manage your own brand, your employer's or clients' accounts, these skills are valuable. If you choose to offer them as a service, package them clearly so buyers understand exactly what they get.</p>
<h3>Common services</h3>
<ul><li><strong>Social media audit:</strong> a one-off review with recommendations.</li>
<li><strong>Strategy:</strong> goals, persona, pillars, content plan.</li>
<li><strong>Content creation:</strong> graphics, Reels, captions.</li>
<li><strong>Full management:</strong> content + scheduling + community management + reporting.</li>
<li><strong>Paid ads management:</strong> setup, optimisation, reporting (ad spend paid separately).</li>
<li><strong>Training/coaching:</strong> teaching business owners to do it themselves.</li></ul>
<h3>Package it in tiers</h3>
<div class="tbl"><table><tr><th>Package</th><th>Example inclusions</th></tr>
<tr><td>Starter</td><td>1 platform, 8 posts/month, basic captions, monthly report</td></tr>
<tr><td>Growth</td><td>2 platforms, 12 posts incl. 4 Reels, Stories, community management, report</td></tr>
<tr><td>Premium</td><td>Everything in Growth + ads management + content shoot + strategy call</td></tr></table></div>
<div class="callout"><b>Pick a niche if you can</b>"Social media for clinics and health professionals" is easier to market and justifies higher pricing than "social media for everyone".</div>`,
takeaways:["Package your skills into clear services.","Tiered packages make it easy for clients to say yes.","A niche makes marketing and pricing easier."]},
{title:"Pricing your work", body:`
<p>Pricing is where many new social media managers struggle. Price based on the value delivered and the work required, not on fear.</p>
<h3>A simple pricing formula</h3>
<div class="example"><span class="mono">Formula</span>Monthly price = (estimated hours per month × your hourly rate) + tools and costs + profit margin</div>
<h3>Factors that raise your price</h3>
<ul><li>Number of platforms and posts</li><li>Video production (more time than graphics)</li><li>Community management hours</li><li>Ads management</li><li>Your results, case studies and niche expertise</li><li>Urgency and the client's business size</li></ul>
<h3>Protect yourself</h3>
<ul><li>Charge monthly retainers, paid <strong>upfront</strong> (or at least 50% upfront for projects).</li>
<li>Ad spend is always paid by the client, separately from your fee.</li>
<li>Define exactly what's included. Extra requests are quoted separately to avoid <strong>scope creep</strong>.</li>
