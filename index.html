app.innerHTML = `
<section class="mhead"><div class="wrap" style="padding-bottom:30px">
<button class="back" id="backBtn" type="button">${ICON.arrow} All modules</button>
<h1>Congratulations</h1><p class="tag">You completed all ${MODULES.length} modules of the Social Media Marketing Masterclass.</p>
</div></section>
<div class="wrap certwrap">
<div class="certctl">
<label for="certName">Name on certificate<input id="certName" type="text" maxlength="48" placeholder="Type your full name" value="${esc(S.name||"")}"></label>
<button class="btn btn-primary" type="button" id="dlCert" hidden>Save certificate (PNG)</button>
</div>
<canvas id="cert" width="1600" height="1130" role="img" aria-label="Certificate of completion"></canvas>
<p class="note" id="certNote">Tip: you can also take a screenshot of your certificate to share it.</p>
</div>`;
document.getElementById("backBtn").onclick = () => { renderHome(); toTop(); };
const inp = document.getElementById("certName");
inp.oninput = () => { S.name = inp.value; save(); drawCert(); };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(drawCert);
drawCert(); toTop(); updateBar(); setupDownload();
}
function drawCert(){
const c = document.getElementById("cert"); if (!c) return;
const x = c.getContext("2d"), W = c.width, H = c.height;
const G="#0B3A30", GOLD="#B9811A", INK="#13201B", MUTED="#5A6863";
x.fillStyle="#FFFDF8"; x.fillRect(0,0,W,H);
x.fillStyle=G; x.fillRect(0,0,W,22); x.fillRect(0,H-22,W,22);
x.strokeStyle=GOLD; x.lineWidth=3; x.strokeRect(50,60,W-100,H-120);
x.lineWidth=1; x.strokeRect(64,74,W-128,H-148);
x.fillStyle=G; x.beginPath(); x.roundRect ? x.roundRect(W/2-34,120,68,68,16) : x.rect(W/2-34,120,68,68); x.fill();
x.strokeStyle="#FFFFFF"; x.lineWidth=5; x.lineCap="round";
[[W/2-18,172,W/2-18,150],[W/2-2,172,W/2-2,136],[W/2+14,172,W/2+14,156]].forEach(([a,b,cx,d])=>{x.beginPath();x.moveTo(a,b);x.lineTo(cx,d);x.stroke();});
x.textAlign="center"; x.fillStyle=GOLD; x.font='600 22px "JetBrains Mono", monospace';
x.fillText("CERTIFICATE OF COMPLETION", W/2, 250);
x.fillStyle=INK; x.font='800 64px "Bricolage Grotesque", sans-serif';
x.fillText("Social Media Marketing Masterclass", W/2, 330);
x.fillStyle=MUTED; x.font='400 28px "Figtree", sans-serif';
x.fillText("This certifies that", W/2, 420);
const nm = (S.name||"").trim() || "Your Name";
let fs = 92; x.font = `800 ${fs}px "Bricolage Grotesque", sans-serif`;
while (x.measureText(nm).width > W-320 && fs > 40) { fs -= 4; x.font = `800 ${fs}px "Bricolage Grotesque", sans-serif`; }
x.fillStyle=G; x.fillText(nm, W/2, 525);
x.strokeStyle=GOLD; x.lineWidth=2; x.beginPath(); x.moveTo(W/2-300,560); x.lineTo(W/2+300,560); x.stroke();
x.fillStyle=MUTED; x.font='400 27px "Figtree", sans-serif';
x.fillText("has completed all nine modules and passed every assessment, covering strategy,", W/2, 625);
x.fillText("platforms, content creation, scheduling, community, paid ads, analytics and career skills.", W/2, 665);
const d = new Date(S.done || Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
const total = MODULES.reduce((a,m,i)=>a+((S.quiz[i]&&S.quiz[i].best)||0),0);
x.font='600 20px "JetBrains Mono", monospace'; x.fillStyle=GOLD;
x.fillText(`${MODULES.length} MODULES · ${totalLessons} LESSONS · QUIZ SCORE ${total}/${totalQs}`, W/2, 740);
x.textAlign="left"; x.fillStyle=INK; x.font='700 32px "Bricolage Grotesque", sans-serif'; x.fillText("Emerie Jane", 180, 900);
x.strokeStyle=INK; x.lineWidth=1.5; x.beginPath(); x.moveTo(180,915); x.lineTo(560,915); x.stroke();
x.fillStyle=MUTED; x.font='400 22px "Figtree", sans-serif'; x.fillText("Course facilitator", 180, 950);
x.textAlign="right"; x.fillStyle=INK; x.font='700 32px "Bricolage Grotesque", sans-serif'; x.fillText(d, W-180, 900);
x.beginPath(); x.moveTo(W-560,915); x.lineTo(W-180,915); x.stroke();
x.fillStyle=MUTED; x.font='400 22px "Figtree", sans-serif'; x.fillText("Date of completion", W-180, 950);
x.textAlign="center"; x.fillStyle=GOLD; x.beginPath(); x.arc(W/2, 905, 62, 0, Math.PI*2); x.fill();
x.fillStyle="#FFFDF8"; x.font='800 30px "Bricolage Grotesque", sans-serif'; x.fillText("SMM", W/2, 902);
x.font='600 14px "JetBrains Mono", monospace'; x.fillText("CERTIFIED", W/2, 928);
}
async function setupDownload(){
try {
if (!window.claude || !window.claude.use) return;
const dl = await window.claude.use("downloads");
const btn = document.getElementById("dlCert");
if (!dl || !btn) return;
btn.hidden = false;
btn.onclick = () => {
document.getElementById("cert").toBlob(async blob => {
if (!blob) return;
const safe = ((S.name||"Certificate").replace(/[^\w .-]/g,"").trim() || "Certificate");
try { await dl.save({ filename: safe + " - SMM Masterclass Certificate.png", data: blob }); toast("Certificate saved"); }
catch(e){ if (e && (e.code==="unavailable"||e.code==="not_granted"||e.code==="capability_disabled")) btn.hidden = true; else if (e && e.code==="declined") toast("Save cancelled"); else toast("Couldn't save right now. Take a screenshot instead."); }
}, "image/png");
};
} catch(e) {}
}
document.getElementById("homeBtn").onclick = () => { renderHome(); toTop(); };
try { renderHome(); }
catch(e) { app.innerHTML = '<div class="wrap" style="padding-block:40px"><h2>Something went wrong loading the course</h2><p style="margin-top:10px;color:var(--muted)">Please refresh the page, or open the link in Chrome or Safari.</p></div>'; }
</script>
</body></html>
